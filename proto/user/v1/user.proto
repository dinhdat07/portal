syntax = "proto3";

package portal.user.v1;

option go_package = "portal-system/gen/go/user/v1;userv1";

import "google/api/annotations.proto";
import "common/v1/common.proto";
import "buf/validate/validate.proto";

service UserService {
  rpc GetMyProfile(GetMyProfileRequest) returns (portal.common.v1.User) {
    option (google.api.http) = {
      get: "/api/v1/users/me"
    };
  }

  rpc UpdateMyProfile(UpdateMyProfileRequest) returns (portal.common.v1.User) {
    option (google.api.http) = {
      put: "/api/v1/users/me"
      body: "*"
    };
  }

  rpc ChangeMyPassword(ChangeMyPasswordRequest) returns (portal.common.v1.MessageResponse) {
    option (google.api.http) = {
      put: "/api/v1/users/me/change-password"
      body: "*"
    };
  }

  // Notification APIs
  rpc ListMyNotifications(ListMyNotificationsRequest) returns (ListMyNotificationsResponse) {
    option (google.api.http) = {
      get: "/api/v1/users/me/notifications"
    };
  }

  rpc GetMyNotificationDetail(GetMyNotificationDetailRequest) returns (portal.common.v1.UserNotification) {
    option (google.api.http) = {
      get: "/api/v1/users/me/notifications/{notification_id}"
    };
  }

  rpc MarkNotificationAsRead(MarkNotificationAsReadRequest) returns (portal.common.v1.MessageResponse) {
    option (google.api.http) = {
      patch: "/api/v1/users/me/notifications/{notification_id}/read"
    };
  }

  rpc MarkAllNotificationsAsRead(MarkAllNotificationsAsReadRequest) returns (portal.common.v1.MessageResponse) {
    option (google.api.http) = {
      patch: "/api/v1/users/me/notifications/read-all"
    };
  }

  rpc GetUnreadNotificationCount(GetUnreadNotificationCountRequest) returns (GetUnreadNotificationCountResponse) {
    option (google.api.http) = {
      get: "/api/v1/users/me/notifications/unread-count"
    };
  }
}

message GetMyProfileRequest {}

message UpdateMyProfileRequest {
  optional string first_name = 1 [
    (buf.validate.field).string = {
      min_len: 1,
      max_len: 100
    }
  ];

  optional string last_name = 2 [
    (buf.validate.field).string = {
      min_len: 1,
      max_len: 100
    }
  ];

  optional string username = 3 [
    (buf.validate.field).string = {
      min_len: 3,
      max_len: 50
    }
  ];

  optional string dob = 4 [
    (buf.validate.field).string = {
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    }
  ];
}

message ChangeMyPasswordRequest {
  string current_password = 1 [
    (buf.validate.field).string = {
      min_len: 1
    }
  ];

  string new_password = 2 [
    (buf.validate.field).string = {
      min_len: 8,
      max_len: 255
    }
  ];

  string confirm_new_password = 3 [
    (buf.validate.field).string = {
      min_len: 8,
      max_len: 255
    }
  ];
}

message ListMyNotificationsRequest {
  int32 page = 1 [
    (buf.validate.field).int32 = {
      gte: 1
    }
  ];

  int32 page_size = 2 [
    (buf.validate.field).int32 = {
      gte: 1,
      lte: 100
    }
  ];

  bool unread_only = 3;
}

message ListMyNotificationsResponse {
  repeated portal.common.v1.UserNotification data = 1;
  portal.common.v1.PaginationMeta meta = 2;
}

message GetMyNotificationDetailRequest {
  string notification_id = 1 [
    (buf.validate.field).string.uuid = true
  ];
}

message MarkNotificationAsReadRequest {
  string notification_id = 1 [
    (buf.validate.field).string.uuid = true
  ];
}

message MarkAllNotificationsAsReadRequest {}

message GetUnreadNotificationCountRequest {}

message GetUnreadNotificationCountResponse {
  int64 count = 1;
}