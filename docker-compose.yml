services:
  db:
    image: postgres:15
    container_name: portal_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
    ports:
      - "5433:5432"
    volumes:
      - postgres_portal_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: portal_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: portal_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  kafka:
    image: apache/kafka:4.1.2
    container_name: portal_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      KAFKA_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_portal_data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:4.1.2
    container_name: portal_kafka_init
    depends_on:
      - kafka
    restart: "no"
    command:
      - bash
      - -lc
      - |
        set -e

        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do
          sleep 2
        done

        create_topic() {
          local topic="$$1"
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
            --create --if-not-exists \
            --topic "$$topic" \
            --partitions 1 \
            --replication-factor 1
        }

        create_topic notification.requested
        create_topic portal.public.users
        create_topic portal.public.action_logs

  kafka-connect:
    image: quay.io/debezium/connect:3.1
    container_name: portal_kafka_connect
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: "kafka:29092"
      GROUP_ID: "portal-connect-cluster"

      CONFIG_STORAGE_TOPIC: "portal_connect_configs"
      OFFSET_STORAGE_TOPIC: "portal_connect_offsets"
      STATUS_STORAGE_TOPIC: "portal_connect_statuses"

      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"

      KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: portal_elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: "single-node"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_portal_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9200 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: portal_kibana
    restart: unless-stopped
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
    ports:
      - "5601:5601"

  cdc-consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: portal_cdc_consumer
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_USER_TOPIC: portal.public.users
      KAFKA_AUDIT_LOG_TOPIC: portal.public.action_logs
      KAFKA_CONSUMER_GROUP: portal-search-indexer
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USER_INDEX: portal_users
      ELASTICSEARCH_AUDIT_LOG_INDEX: portal_action_logs

volumes:
  postgres_portal_data:
  kafka_portal_data:
  elasticsearch_portal_data:
